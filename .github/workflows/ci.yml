name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install frontend dependencies
        run: ./scripts/ci.sh frontend-install

      - name: Lint frontend
        run: ./scripts/ci.sh frontend-lint

      - name: Run frontend unit tests
        run: ./scripts/ci.sh frontend-unit-tests

      - name: Build frontend
        run: ./scripts/ci.sh frontend-build

      - name: Run tests
        run: ./scripts/ci.sh go-tests

      - name: Run agent tunnel race tests
        run: ./scripts/ci.sh agent-tunnel-race-tests

      - name: Run agent relay rollout race tests
        run: ./scripts/ci.sh agent-relay-race-tests
